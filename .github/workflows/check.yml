name: check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"

# A newer push to the same branch or PR makes the older run's result obsolete, so
# cancel it rather than let both run to completion. The event name is in the key,
# so a push never cancels the weekly scheduled drift check, and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The check only reads the code to lint, type, and test it -- it never writes to the
# repo -- so it runs with the least privilege that still allows a checkout.
permissions:
  contents: read

jobs:
  check:
    # The full check lives in reusable-check.yml so the release gate in
    # publish.yml runs the identical job on the release commit.
    uses: ./.github/workflows/reusable-check.yml

  blocked-list-drift:
    # The size limit is asked of the server on every send, so it cannot go stale.
    # The blocked-extension list can: it is a snapshot of what Google published,
    # and Google can change it without telling anyone. This is the only part of
    # what the package knows that has no way of noticing it went wrong.
    #
    # Weekly and on demand, never on a push: a code change is not the reason the
    # list would move, and a Google page edit must not turn someone's pull
    # request red.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: |
          uv venv
          uv pip install -e .
      - run: .venv/bin/python scripts/check_blocked_list.py
