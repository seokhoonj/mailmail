[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailmail"
version = "0.2.0"
description = "Send mail through Gmail or Naver SMTP, with the provider's own rules checked before anything is sent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
keywords = ["email", "smtp", "gmail", "naver", "mail-merge", "attachments"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
# No runtime dependencies on purpose: smtplib, email, tomllib, and json carry the
# whole package, and a mail sender that never breaks on someone else's release is
# worth more than any convenience a third party would add.
dependencies = []

[project.scripts]
mailmail = "mailmail.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/seokhoonj/mailmail"
Repository = "https://github.com/seokhoonj/mailmail"
Issues = "https://github.com/seokhoonj/mailmail/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mailmail"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# The provider tables and keyword-argument blocks are aligned on purpose; the
# formatter would collapse that alignment, so formatting stays advisory here.
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

# Tests get the real checks but not the annotation ceremony: `-> None` on two
# hundred test functions is noise, and the signature of a test is never the thing
# under review. The package itself is strict without exception -- it is the part
# with a contract, and an unchecked hint there is exactly what let `to` claim to
# be a tuple while accepting a string.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true
